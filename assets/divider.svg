<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#0ea5e9" stop-opacity=".1"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".1"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
</linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="0" y="10" width="900" height="3" rx="1.5" fill="url(#fl)"/>
<circle r="5" cy="11.5" fill="#38bdf8" filter="url(#g)"><animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/></circle>
<circle r="2.5" cy="11.5" fill="#fff"><animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/></circle>
</svg>
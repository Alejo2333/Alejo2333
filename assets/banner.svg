<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<defs>
<clipPath id="r"><rect width="1000" height="260" rx="16"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f2a3a"/></linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-8px,2px)}92%{transform:translate(6px,-3px)}95%{transform:translate(-4px,1px)}}
@keyframes g2{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(8px,-2px)}92%{transform:translate(-6px,3px)}95%{transform:translate(4px,-1px)}}
@keyframes flick{0%,86%,100%{opacity:1}88%{opacity:.6}90%{opacity:1}93%{opacity:.75}}
.g1{animation:g1 4s infinite} .g2{animation:g2 4s infinite} .m{animation:flick 4s infinite}
@media (prefers-reduced-motion: reduce){.g1,.g2,.m{animation:none}}
</style>
</defs>
<g clip-path="url(#r)">
<rect width="1000" height="260" fill="url(#bg)"/>
<rect width="1000" height="3" fill="#38bdf8" opacity=".18"><animate attributeName="y" from="-3" to="260" dur="3.2s" repeatCount="indefinite"/></rect>
<g font-family="'Courier New',monospace" font-weight="700" font-size="98" text-anchor="middle" letter-spacing="10">
<text class="g1" x="505" y="158" fill="#f0abfc" opacity=".8">ALEJO</text>
<text class="g2" x="505" y="158" fill="#22d3ee" opacity=".8">ALEJO</text>
<text class="m" x="505" y="158" fill="#ffffff" filter="url(#glow)">ALEJO</text>
</g>
</g>
<rect x="1" y="1" width="998" height="258" rx="16" fill="none" stroke="#38bdf8" stroke-opacity=".35"/>
</svg>
